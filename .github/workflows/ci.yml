name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  bundle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: the committed hook runs with nothing installed
        run: |
          set -e
          # No npm install: a plugin is cloned, not installed. The bundle must
          # run with Node alone and fail closed on bad input.
          out=$(echo 'not json' | node scripts/phone-approval.mjs)
          echo "$out" | grep -q '"permissionDecision":"deny"'
          out=$(echo '{"hook_event_name":"PreToolUse","session_id":"s","tool_use_id":"t","tool_name":"Bash","tool_input":{"command":"git push"},"cwd":"/tmp"}' | node scripts/phone-approval.mjs)
          echo "$out" | grep -q 'not configured'
          out=$(echo '{"hook_event_name":"PreToolUse","session_id":"s","tool_use_id":"t","tool_name":"Bash","tool_input":{"command":"git status"},"cwd":"/tmp"}' | node scripts/phone-approval.mjs)
          test -z "$out"
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: manifests parse and the skill has frontmatter
        run: |
          set -e
          node -e 'JSON.parse(require("fs").readFileSync(".claude-plugin/plugin.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("hooks/hooks.json","utf8"))'
          grep -q '^name: humanauth-approvals$' skills/humanauth-approvals/SKILL.md
          grep -q '^description: ' skills/humanauth-approvals/SKILL.md
          test -f LICENSE
